<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤·카드 스튜디오</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header>
  <div>
    <h1>짤·카드 스튜디오</h1>
    <span class="sub">이미지 + 문구 → 밈·카드·SNS 이미지</span>
  </div>
  <div class="row" style="flex:0 0 auto">
    <button id="btnExportJson">JSON 내보내기</button>
    <button id="btnImportJson">JSON 가져오기</button>
    <input type="file" id="fileImportJson" class="hidden-file"
           accept="application/json,.json">
    <button id="btnDownload" class="primary">이미지 다운로드</button>
  </div>
</header>

<div class="app">
  <!-- 좌측: 이미지 + 문구 + 배경 -->
  <aside class="panel">
    <div class="section">
      <h2>1. 이미지</h2>
      <input type="file" id="fileImage"
             accept="image/png,image/jpeg,image/webp" class="hidden-file">
      <button class="block primary" id="btnPickImage">PNG · JPEG 불러오기</button>
      <div class="txt-pos-label" id="imgInfo">
        이미지를 불러오세요 (드래그&드롭 가능)
      </div>

      <!-- [FILTER] 이미지 필터 슬라이더 컨트롤 영역 시작 -->
      <div class="filter-controls" style="margin-top: 12px;">
        <label>밝기 <span class="badge" id="filterBrightnessVal">100%</span></label>
        <input type="range" id="filterBrightness" min="0" max="200" value="100">

        <label style="margin-top: 6px;">대비 <span class="badge" id="filterContrastVal">100%</span></label>
        <input type="range" id="filterContrast" min="0" max="200" value="100">

        <label style="margin-top: 6px;">채도 <span class="badge" id="filterSaturateVal">100%</span></label>
        <input type="range" id="filterSaturate" min="0" max="200" value="100">
      </div>
      <!-- [FILTER] 이미지 필터 슬라이더 컨트롤 영역 끝 -->
    </div>

    <div class="section">
      <h2>2. 문구</h2>
      <label for="txtContent">텍스트</label>
      <textarea id="txtContent">안녕하세요 😀</textarea>

      <div class="field-grid" style="margin-top:10px">
        <div class="full">
          <label>크기 <span class="badge" id="txtSizeVal">48</span></label>
          <input type="range" id="txtSize" min="4" max="400" value="48">
        </div>
        <div class="full">
          <label>색상</label>
          <input type="color" id="txtColor" value="#ffffff">
        </div>
        <div>
          <label>가로 <span class="badge" id="txtXVal">50%</span></label>
          <input type="range" id="txtX" min="-100" max="200" value="50">
        </div>
        <div>
          <label>세로 <span class="badge" id="txtYVal">50%</span></label>
          <input type="range" id="txtY" min="-100" max="200" value="50">
        </div>
        <div class="full">
          <label>정렬</label>
          <select id="txtAlign">
            <option value="center">가운데</option>
            <option value="left">왼쪽</option>
            <option value="right">오른쪽</option>
          </select>
        </div>
        <div class="full">
          <label>굵기</label>
          <select id="txtWeight">
            <option value="400">보통</option>
            <option value="700" selected>굵게</option>
            <option value="900">매우 굵게</option>
          </select>
        </div>
        <div class="full">
          <label>외곽선</label>
          <div class="row">
            <input type="color" id="txtStrokeColor" value="#000000">
            <input type="range" id="txtStroke" min="0" max="20" value="0">
            <span class="val" id="txtStrokeVal">0</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>3. 배경</h2>
      <label>배경색 (이미지 없을 때)</label>
      <input type="color" id="bgColor" value="#5b8cff">
    </div>
  </aside>

  <!-- 가운데: 미리보기 -->
  <main class="stage" id="stage">
    <div class="empty-hint" id="emptyHint">
      <p>이미지를 불러오거나 문구를 입력하세요.</p>
    </div>
    <div class="canvas-wrap grab" id="canvasWrap" style="display:none">
      <canvas id="canvas"></canvas>
    </div>
    <div class="stage-info" id="stageInfo" style="display:none">
      <span>비율 <b id="infoRatio">1:1</b></span>
      <span>캔버스 <b id="infoSize">-</b></span>
    </div>
  </main>

  <!-- 우측: 비율 + 템플릿 + 내보내기 + 샘플 -->
  <aside class="panel">
    <div class="section">
      <h2>화면비</h2>
      <div class="chips" id="ratioChips">
        <div class="chip active" data-ratio="1:1">1:1</div>
        <div class="chip" data-ratio="4:5">4:5</div>
        <div class="chip" data-ratio="9:16">9:16</div>
      </div>
      <div class="txt-pos-label" id="ratioInfo">1:1 · 1080×1080</div>
    </div>

    <div class="section">
      <h2>템플릿</h2>
      <div class="row">
        <input type="text" id="tplName" placeholder="템플릿 이름">
        <button id="btnSaveTpl" class="primary" style="flex:0 0 auto">저장</button>
      </div>
      <div class="tpl-list" id="tplList" style="margin-top:10px"></div>
      <div class="txt-pos-label" id="tplCount">
        0개 저장됨 · 새로고침 후에도 유지
      </div>
      <div class="txt-pos-label" style="margin-top:6px">
        이름 더블클릭 = 이름 수정 · "덮어쓰기" = 현재 상태로 갱신
      </div>
    </div>

    <div class="section">
      <h2>내보내기</h2>
      <div class="row">
        <select id="exportFormat">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
        </select>
        <button id="btnDownload2" class="primary" style="flex:0 0 auto">
          다운로드
        </button>
      </div>
      <div class="txt-pos-label">위치 메타데이터 미포함 저장</div>
    </div>

    <div class="section">
      <h2>샘플</h2>
      <button class="block" id="btnLoadSample1">샘플 ① 밈 카드</button>
      <button class="block" id="btnLoadSample2" style="margin-top:6px">
        샘플 ② SNS 카드
      </button>
      <button class="block" id="btnLoadSample3" style="margin-top:6px">
        샘플 ③ 세로 스토리
      </button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
